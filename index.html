<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="google-site-verification" content="LjZp-tubX-_vxReMNVsQBOiwyoliQPJO4wjsoVyFM4E" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Motorradtouren planen & organisieren</title>
  <meta name="description" content="MotoRoute ist die App für Motorradfahrer: Touren planen, Gruppen organisieren, Check-ins, Wettervorhersage und Chat – alles in einer PWA." />
  <link rel="canonical" href="https://offroadtours.netlify.app/" />

  <!-- Open Graph / Social -->
  <meta property="og:type"        content="website" />
  <meta property="og:url"         content="https://offroadtours.netlify.app/" />
  <meta property="og:title"       content="MotoRoute – Motorradtouren planen & organisieren" />
  <meta property="og:description" content="Touren planen, Gruppen organisieren, Check-ins und Wettervorhersage für Motorradfahrer." />
  <meta property="og:image"       content="https://offroadtours.netlify.app/img/icon-512x512.png" />

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json?v=2" />
  <meta name="theme-color" content="#d4ff3a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MotoRoute" />
  <link rel="icon" href="/img/favicon-32x32.png?v=1" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />

  <!-- Preload LCP image (logo shown immediately after JS boot on auth/loading screens) -->
  <link rel="preload" as="image" href="img/logo.webp" fetchpriority="high" />

  <!-- Preconnect to external resources -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://kkoeeyqxubtcqvonckss.supabase.co" />
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com" />
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
    rel="stylesheet"
  />

  <!-- App styles (Leaflet CSS is lazy-loaded on first map view via loadLeaflet()) -->
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/theme-premium.css" />
</head>
<body>
  <div id="app"><div class="loading-screen">MOTOROUTE…</div></div>

  <!-- Vendored libraries (defer: keeps order, doesn't block parsing) -->
  <!-- Leaflet is lazy-loaded on first map view (see loadLeaflet() in utils.js) -->
  <script defer src="vendor/supabase/supabase-js-2.umd.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>

  <!-- App scripts – order matters (globals), defer preserves order -->
  <script defer src="js/config.js"></script>
  <script defer src="js/state.js"></script>
  <script defer src="js/utils.js"></script>
  <script defer src="js/gpx-cache.js"></script>
  <script defer src="js/api.js"></script>
  <script defer src="js/auth.js"></script>
  <script defer src="js/map.js"></script>
  <script defer src="js/render.js"></script>
  <script defer src="js/events.js"></script>
  <script defer src="js/pwa.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
